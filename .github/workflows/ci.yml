name: LeaseMate CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leasemate_ci?schema=public
      NEXT_TELEMETRY_DISABLED: 1
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: leasemate_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d leasemate_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Prepare CI database
        run: npm run db:push

      - name: Seed CI database
        run: npm run db:seed

      - name: Run unit tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build
